[package]
name = "agenttoast"
version.workspace = true
edition.workspace = true
description = "AgentToast — Cross-agent attention & action router"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agenttoast-core = { path = "../crates/agenttoast-core" }
agenttoast-ipc = { path = "../crates/agenttoast-ipc" }
agenttoast-adapters = { path = "../crates/agenttoast-adapters" }
agenttoast-remote = { path = "../crates/agenttoast-remote" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
dirs = "6"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
