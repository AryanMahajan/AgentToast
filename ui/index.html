<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentToast</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="toast-container">
        <div class="toast" id="toast">
            <div class="toast-header">
                <div class="toast-icon" id="toast-icon">⚡</div>
                <div class="toast-title" id="toast-title">Agent needs attention</div>
                <button class="toast-close" id="toast-close" title="Dismiss">×</button>
            </div>
            <div class="toast-body">
                <p class="toast-message" id="toast-message">Loading...</p>
                <p class="toast-context" id="toast-context"></p>
            </div>
            <div class="toast-actions" id="toast-actions">
                <!-- Buttons will be dynamically inserted -->
            </div>
        </div>
    </div>
    <script src="toast.js"></script>
</body>
</html>
