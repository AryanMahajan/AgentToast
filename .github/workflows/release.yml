# Builds the Windows installer and attaches it to a GitHub Release.
#
# Triggered by pushing a tag like v0.1.0. The version in the tag should match
# the one in Cargo.toml — nothing enforces that, so check before tagging.
name: Release

on:
  push:
    tags:
      - "v*"
  # Lets you build an installer without tagging, to check the workflow itself.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Runs alongside the build rather than before it. Tests need a debug build of
  # the whole tree and the installer needs a release one, so making the build
  # wait for the tests would mean compiling everything twice, in series.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - run: cargo test --workspace

  installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: installer

      # Fetches a prebuilt tauri-cli. `cargo install` would compile it from
      # source, which costs well over ten minutes on a Windows runner every
      # time the cache misses.
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install the Tauri CLI
        run: cargo binstall tauri-cli --version "^2" --no-confirm --locked

      # The extra config adds the bridge binaries to the bundle. They are kept
      # out of the main config because Tauri checks resource paths at compile
      # time, which would break a plain `cargo build`.
      - name: Build the installer
        run: cargo tauri build --config src-tauri/tauri.bundle.conf.json

      - name: Upload the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentToast-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Attach the installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: target/release/bundle/nsis/*-setup.exe
          body: |
            Download the `.exe` below and run it.

            Windows will warn that the publisher is unknown — the installer is
            not code-signed. Choose **More info → Run anyway**.

            After installing, open the dashboard from the tray icon and press
            **Connect** — under *Claude Code*, under *Antigravity*, or both —
            then restart any session that is already running. Both agents read
            their hooks when a session starts.
