<!doctype html>
<html lang="en">

<!--
  Shown to a device that has no valid token: never paired, revoked from the
  dashboard, or a pairing code that had already been spent.

  It says nothing about the machine — no sessions, no folders, no agent names —
  because anyone on the network can load it. All it does is tell a person which
  button to press on their PC.
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>AgentToast — pair this device</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%234c5fd7'/%3E%3C/svg%3E">
  <style>
    :root {
      --surface: #fcfcfd;
      --raised: #ffffff;
      --border: rgba(0, 0, 0, 0.09);
      --fg: #16171a;
      --fg2: #565a61;
      --fg3: #8a8e96;
      --accent: #4c5fd7;
      --accent-on: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #1c1d21;
        --raised: #2a2b31;
        --border: rgba(255, 255, 255, 0.1);
        --fg: #f3f4f6;
        --fg2: #a9adb6;
        --fg3: #7b8089;
        --accent: #8098f8;
        --accent-on: #141519;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--surface);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
    }

    main {
      width: 100%;
      max-width: 380px;
      background: var(--raised);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 26px 22px;
    }

    .badge {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent);
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 19px;
      font-weight: 650;
      letter-spacing: -0.015em;
    }

    p {
      margin: 0 0 18px;
      color: var(--fg2);
      font-size: 14.5px;
    }

    ol {
      margin: 0;
      padding-left: 20px;
      color: var(--fg2);
      font-size: 14.5px;
    }

    li { margin-bottom: 9px; }
    li:last-child { margin-bottom: 0; }

    strong { color: var(--fg); font-weight: 620; }

    .status {
      margin: 0 0 18px;
      padding: 11px 13px;
      border-radius: 9px;
      background: rgba(195, 58, 46, 0.11);
      color: var(--fg);
      font-size: 13.5px;
      font-weight: 550;
    }

    footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      color: var(--fg3);
      font-size: 12.5px;
    }
  </style>
</head>

<body>
  <main>
    <div class="badge"></div>
    <h1>Pair this device</h1>
    <!--STATUS-->
    <p>This browser is not paired with AgentToast yet.</p>
    <ol>
      <li>On your PC, open the AgentToast dashboard from the tray icon.</li>
      <li>Go to <strong>Remote</strong> and press <strong>Pair a device</strong>.</li>
      <li>Scan the QR code it shows with this phone.</li>
    </ol>
    <footer>
      A pairing code is good for five minutes and can only be used once.
    </footer>
  </main>
</body>

</html>
