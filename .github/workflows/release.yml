# Builds the Windows installer and the macOS disk image, and attaches both to a
# GitHub Release.
#
# Triggered by pushing a tag like v0.1.0. The version in the tag should match
# the one in Cargo.toml — nothing enforces that, so check before tagging.
name: Release

on:
  push:
    tags:
      - "v*"
  # Lets you build the artifacts without tagging, to check the workflow itself.
  # The release job is skipped, so nothing is published.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Runs alongside the builds rather than before them. Tests need a debug build
  # of the whole tree and the bundles need a release one, so making the builds
  # wait for the tests would mean compiling everything twice, in series.
  #
  # Both platforms, because a passing Windows suite says nothing about the
  # `#[cfg(target_os = "macos")]` half of the tree — it is not compiled there.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}
      - run: cargo test --workspace

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The dashboard is a React app built by Vite, and `beforeBuildCommand`
      # runs `npm run build`, so the Tauri build needs Node and the packages.
      # Installing here rather than in `beforeBuildCommand` keeps a local build
      # from reinstalling everything each time it runs.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install front-end packages
        run: npm ci

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: installer

      # Fetches a prebuilt tauri-cli. `cargo install` would compile it from
      # source, which costs well over ten minutes on a Windows runner every
      # time the cache misses.
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install the Tauri CLI
        run: cargo binstall tauri-cli --version "^2" --no-confirm --locked

      # The extra config adds the bridge binaries to the bundle. They are kept
      # out of the main config because Tauri checks resource paths at compile
      # time, which would break a plain `cargo build`.
      - name: Build the installer
        run: cargo tauri build --config src-tauri/tauri.bundle.conf.json

      - name: Upload the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentToast-installer-windows
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    outputs:
      signed: ${{ steps.build.outputs.signed }}

    steps:
      - uses: actions/checkout@v4

      # Both architectures, because the disk image is universal: `cargo` has no
      # universal target, so `build.sh` builds each one and `lipo`s them
      # together the way Tauri does for the app binary itself.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install front-end packages
        run: npm ci

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: macos

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install the Tauri CLI
        run: cargo binstall tauri-cli --version "^2" --no-confirm --locked

      # Not a bare `cargo tauri build`: the mac config carries the `.icns`, the
      # bundle targets and the bridges under the names they have here, and the
      # bridges have to be built for the same target as the app or an Intel Mac
      # gets an app it can run and two bridges it cannot. See the script.
      #
      # Signing and notarising are what make the disk image something a stranger
      # can actually open. Without them Gatekeeper refuses a downloaded copy
      # outright, and the only way past is a Terminal command — which is a fine
      # ask of a contributor and an unreasonable one of a user.
      #
      # The Tauri CLI reads all of these itself: given APPLE_CERTIFICATE it
      # imports the .p12 into a temporary keychain, signs the app with the
      # hardened runtime, and then submits the disk image to Apple and staples
      # the ticket. Every one is optional. A fork, or a repository whose
      # maintainer has no Apple Developer account, has none of these secrets
      # set, and the build falls back to exactly what it did before — unsigned,
      # still installable, just with the quarantine dance.
      - name: Build the app and the disk image
        id: build
        env:
          # Signing. APPLE_SIGNING_IDENTITY looks like
          # "Developer ID Application: Your Name (TEAMID)".
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarising, with an App Store Connect API key. Preferred over an
          # Apple ID and app-specific password because it does not carry a
          # person's account credentials through CI.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ github.workspace }}/apple-api-key.p8
          # Through the environment, never interpolated into the script body: a
          # `${{ }}` expansion is pasted in as literal text before the shell
          # runs, so a key containing a quote would break the script and a
          # hostile value could extend it.
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail

          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Apple signing secrets are set; building unsigned."
          fi

          # The CLI wants the notarisation key as a file on disk, and the secret
          # holds its contents. Written outside the bundle and deleted below.
          if [ -n "${APPLE_API_KEY_CONTENT:-}" ]; then
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY_PATH"
            chmod 600 "$APPLE_API_KEY_PATH"
          else
            unset APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH
          fi

          # Removed however the build ends, so a failure cannot leave a private
          # key sitting in the workspace for a later step to pick up.
          trap 'rm -f "${{ github.workspace }}/apple-api-key.p8"' EXIT

          ./macos/scripts/build.sh --target universal-apple-darwin

      # Proves the artifact is what the release notes will claim it is. An
      # unsigned build is allowed through; a build that was *meant* to be signed
      # and came out unsigned is not, because that only shows up later as a
      # user being told the app is damaged.
      - name: Check the signature
        run: |
          set -euo pipefail
          app=target/universal-apple-darwin/release/bundle/macos/AgentToast.app

          echo "== architectures =="
          lipo -archs "$app/Contents/MacOS/agenttoast"
          for bridge in "$app"/Contents/Resources/agenttoast-bridge-*; do
            echo "$(basename "$bridge"): $(lipo -archs "$bridge")"
          done

          if [ "${{ steps.build.outputs.signed }}" != "true" ]; then
            echo "Unsigned build; skipping signature checks."
            exit 0
          fi

          echo "== signature =="
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=4 "$app" 2>&1 | grep -E "Authority|Identifier|flags"

          # `spctl` is the check Gatekeeper itself makes. It only passes once the
          # notarisation ticket is stapled, so this is the real gate on whether a
          # download will open without a warning.
          echo "== gatekeeper =="
          spctl --assess --type execute --verbose=4 "$app"

      - name: Upload the disk image as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentToast-installer-macos
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # One job publishes, so the two builds cannot race each other into creating
  # two draft releases.
  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Collect both builds
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Draft the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*-setup.exe
            artifacts/**/*.dmg
          body: |
            ## Windows

            Download the `.exe` below and run it.

            Windows will warn that the publisher is unknown — the installer is
            not code-signed. Choose **More info → Run anyway**.

            ## macOS

            Download the `.dmg` below and drag AgentToast to Applications. It is
            universal — Apple silicon and Intel — and needs macOS 10.15 or newer.

            ${{ needs.macos.outputs.signed == 'true' && 'Signed and notarised, so it opens the way any other app does.' || 'This build is **not signed or notarised**, so Gatekeeper will refuse a downloaded copy. Right-click → **Open** the first time, or run `xattr -dr com.apple.quarantine /Applications/AgentToast.app`. If you would rather not, build it yourself — see `macos/README.md`.' }}

            AgentToast lives in the Dock and the menu bar; open the dashboard
            from either.

            ## Then, on either

            Open the dashboard and press **Connect** — under *Claude Code*, under
            *Antigravity*, or both — then restart any session that is already
            running. Both agents read their hooks when a session starts.
